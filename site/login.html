<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portodrac — inloggning</title>
  <style>
    :root {
      --bg: #fbf7f2;
      --surface: #ffffff;
      --text: #24201c;
      --muted: #6b6259;
      --accent: #a3452b;
      --accent-soft: #f0dcd3;
      --border: #e6ddd4;
      --error: #9c2b21;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17130f;
        --surface: #211b16;
        --text: #f2ebe4;
        --muted: #b0a49a;
        --accent: #e98a63;
        --accent-soft: #3a2a22;
        --border: #342b24;
        --error: #ff9c8f;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 24rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 1.75rem;
      box-shadow: 0 18px 40px -32px rgba(0, 0, 0, 0.5);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
    }

    .hint {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hint span {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input[type="password"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    input[type="password"]:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .error {
      margin: 0 0 1rem;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      background: color-mix(in srgb, var(--error) 12%, transparent);
      color: var(--error);
      font-size: 0.9rem;
    }

    .error[hidden] { display: none; }

    .footer {
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="mark" aria-hidden="true">P</p>
    <h1>Portodrac</h1>
    <p class="hint">
      <span>Ange lösenordet för att komma in.</span>
      <span>Enter the password to continue.</span>
    </p>

    <p class="error" id="error" role="alert" hidden>
      Fel lösenord — försök igen. / Wrong password, please try again.
    </p>

    <form method="POST" action="/.netlify/functions/login">
      <label for="password">Lösenord / Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Logga in / Sign in</button>
    </form>

    <p class="footer">Portodrac — privat familjesida / private family page</p>
  </main>

  <script>
    if (new URLSearchParams(window.location.search).has("fel")) {
      document.getElementById("error").hidden = false;
      document.getElementById("password").select();
    }
  </script>
</body>
</html>
